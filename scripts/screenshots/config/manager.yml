domains:
  - example.com
  - example.lan
cert_resolver: letsencrypt
traefik_api_url: http://tmshot-traefik:8080
acme_json_path: /config/acme.json
access_log_path: /config/access.log
auth_enabled: false
setup_complete: true
default_theme: dark
visible_tabs:
  dashboard: true
  routemap: true
  certs: true
  tls: true
  plugins: true
  logs: true
self_route:
  domain: manager.example.com
  router_name: traefik-manager
  entry_point: websecure
managed_middlewares:
  svc::jellyfin-service:
    kind: composite-service
    type: weighted
    children:
      - jellyfin-service-backend-1
      - jellyfin-service-backend-2
    file: /config/dynamic.yml
notification_channels:
  - id: ch-discord
    name: Homelab Alerts
    kind: discord
    enabled: true
    url: https://discord.com/api/webhooks/1289443127755audits/aBcDeFgHiJkLmNoPqRsTuVwXyZ
    categories: [config, backup, traefik, certs, agent, update]
    min_severity: info
    digest: immediate
    quiet_hours: ''
    break_through: false
  - id: ch-ntfy
    name: Security
    kind: ntfy
    enabled: true
    url: https://ntfy.sh/homelab-security
    categories: [security, crowdsec]
    min_severity: warning
    digest: hourly
    quiet_hours: 23:00-07:00
    break_through: true
  - id: ch-unifiedpush
    name: Pixel 9 Pro
    kind: unifiedpush
    enabled: true
    url: https://ntfy.sh/up9f3a2b7c4d1e5f6a
    categories: [certs, agent]
    min_severity: warning
    digest: daily
    quiet_hours: ''
    break_through: false
  - id: ch-oncall
    name: On-call
    kind: slack
    enabled: false
    url: https://hooks.slack.com/services/T024BE7LD/B01UJKLM9/aBcDeFgHiJkLmNoPqRsT
    categories: [security, traefik, crowdsec]
    min_severity: error
    digest: immediate
    quiet_hours: ''
    break_through: false
